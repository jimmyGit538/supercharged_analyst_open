version: 2

models:
  - name: stg_fred_economic__observations
    description: >
      Deduplicated and filtered view over raw.fred_economic_observations.
      One row per (series_id, date), keeping the latest extracted_at when
      duplicates exist. Rows with null series_id or null date are excluded.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series_id, date]
    columns:
      - name: series_id
        description: "FRED series identifier (e.g. FEDFUNDS, DGS10)."
        tests:
          - not_null
      - name: date
        description: "Observation date."
        tests:
          - not_null
      - name: value
        description: >
          Observed value for the series. NULL when FRED returns a
          missing-value sentinel. Do not coerce to 0.
      - name: extracted_at
        description: "UTC timestamp when the row was written to BigQuery."
        tests:
          - not_null

  - name: stg_open_meteo__daily_weather
    description: >
      Deduplicated and filtered view over raw.open_meteo_daily_weather.
      One row per (location_id, date), keeping the latest extracted_at when
      duplicates exist. Rows with null location_id or null date are excluded.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [location_id, date]
    columns:
      - name: location_id
        description: "Fixed city identifier (e.g. new_york, tokyo)."
        tests:
          - not_null
      - name: date
        description: "Observation date (UTC)."
        tests:
          - not_null
      - name: temperature_max_c
        description: "Daily maximum 2m air temperature, Celsius."
      - name: temperature_min_c
        description: "Daily minimum 2m air temperature, Celsius."
      - name: precipitation_sum_mm
        description: "Total daily precipitation, millimetres."
      - name: wind_speed_max_kmh
        description: "Daily maximum 10m wind speed, km/h."
      - name: extracted_at
        description: "UTC timestamp when the row was written to BigQuery."
        tests:
          - not_null
