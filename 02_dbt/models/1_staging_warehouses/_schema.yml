version: 2

models:
  - name: stg_twelvedata__indices_prices
    description: "Cleaned and typed view over the raw Twelvedata indices table. Filters nulls, casts prices to NUMERIC, lowercases ticker."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [index_ticker, date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "high >= low"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "high >= close"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "low <= close"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "close > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "open > 0"
    columns:
      - name: date
        description: "Trading date."
        tests:
          - not_null
      - name: index_ticker
        description: "Lowercase ticker symbol (e.g. ivv, comp, dia)."
        tests:
          - not_null
      - name: open
        description: "Opening price (NUMERIC)."
      - name: high
        description: "Intraday high (NUMERIC)."
      - name: low
        description: "Intraday low (NUMERIC)."
      - name: close
        description: "Closing price (NUMERIC). Rows with null close are filtered out."
        tests:
          - not_null
      - name: volume
        description: "Trading volume."
      - name: extracted_at
        description: "UTC timestamp when the row was written to BigQuery by the extraction job."

  - name: stg_coinmarketcap__categories
    description: "Cleaned and deduplicated view over raw CoinMarketCap categories. One row per category (latest extraction)."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "market_cap_usd >= 0 or market_cap_usd is null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "volume_usd >= 0 or volume_usd is null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "num_tokens >= 0 or num_tokens is null"
    columns:
      - name: id
        description: "CoinMarketCap category identifier."
        tests:
          - not_null
          - unique
      - name: name
        description: "Human-readable category name."
        tests:
          - not_null
      - name: num_tokens
        description: "Number of tokens assigned to this category."
      - name: market_cap_usd
        description: "Total market capitalisation of the category in USD."
      - name: market_cap_change
        description: "24-hour change in market capitalisation (decimal fraction)."
      - name: volume_usd
        description: "24-hour trading volume of the category in USD."
      - name: volume_change
        description: "24-hour change in trading volume (decimal fraction)."
      - name: last_updated
        description: "Timestamp of the last CMC update for this category (string from API)."
      - name: extracted_at
        description: "UTC timestamp when the row was written to BigQuery."

  - name: stg_coinmarketcap__category_coins
    description: "Cleaned and deduplicated bridge view mapping categories to constituent coins. One row per (category_id, coin_id)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [category_id, coin_id]
    columns:
      - name: category_id
        description: "CoinMarketCap category identifier."
        tests:
          - not_null
      - name: category_name
        description: "Human-readable category name."
      - name: coin_id
        description: "CoinMarketCap coin identifier."
        tests:
          - not_null
      - name: coin_symbol
        description: "Coin ticker symbol."
        tests:
          - not_null
      - name: coin_name
        description: "Full coin name."
      - name: coin_slug
        description: "URL slug for the coin on coinmarketcap.com."
      - name: cmc_rank
        description: "CoinMarketCap rank of the coin at extraction time."
      - name: extracted_at
        description: "UTC timestamp when the row was written to BigQuery."

  - name: stg_coinmarketcap__coin_metadata
    description: "Cleaned and deduplicated coin attribute view. One row per coin_id (latest extraction)."
    columns:
      - name: coin_id
        description: "CoinMarketCap coin identifier."
        tests:
          - not_null
          - unique
      - name: symbol
        description: "Coin ticker symbol."
        tests:
          - not_null
      - name: name
        description: "Full coin name."
        tests:
          - not_null
      - name: slug
        description: "URL slug for the coin on coinmarketcap.com."
        tests:
          - not_null
      - name: description
        description: "Long-form description of the coin from CMC."
      - name: category
        description: "Primary category tag from CMC."
      - name: tags
        description: "JSON-serialized array of tags assigned to the coin."
      - name: website
        description: "Primary website URL for the project."
      - name: extracted_at
        description: "UTC timestamp when the row was written to BigQuery."

  - name: stg_coinmarketcap__quotes_daily
    description: "Cleaned and deduplicated daily price view. One row per (date, coin_id). Rows with null date or non-positive price filtered out."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, coin_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "price_usd > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "market_cap_usd >= 0 or market_cap_usd is null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "volume_24h_usd >= 0 or volume_24h_usd is null"
    columns:
      - name: date
        description: "Quote date."
        tests:
          - not_null
      - name: coin_id
        description: "CoinMarketCap coin identifier."
        tests:
          - not_null
      - name: symbol
        description: "Coin ticker symbol."
      - name: name
        description: "Full coin name."
      - name: price_usd
        description: "Closing price in USD (NUMERIC). Always > 0."
        tests:
          - not_null
      - name: volume_24h_usd
        description: "24-hour trading volume in USD."
      - name: market_cap_usd
        description: "Market capitalisation in USD."
      - name: percent_change_1h
        description: "Price percent change over the prior 1 hour."
      - name: percent_change_24h
        description: "Price percent change over the prior 24 hours."
      - name: percent_change_7d
        description: "Price percent change over the prior 7 days."
      - name: extracted_at
        description: "UTC timestamp when the row was written to BigQuery."
