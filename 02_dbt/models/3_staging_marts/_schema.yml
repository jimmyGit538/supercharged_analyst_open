version: 2

models:
  - name: stg_fred_economic__indicators
    description: >
      Pivoted view of national FRED indicators. One row per date.
      Each column represents a single FRED series. Dates without an
      observation for a given series will have NULL for that column —
      this is correct behaviour given the mixed reporting frequencies
      (daily, monthly, quarterly).
    columns:
      - name: date
        description: "Observation date. Primary time dimension."
        tests:
          - not_null
      - name: fed_funds_rate
        description: "Federal Funds Rate (FEDFUNDS, monthly)."
      - name: treasury_yield_10y
        description: "10-Year Treasury Yield (DGS10, daily)."
      - name: treasury_yield_2y
        description: "2-Year Treasury Yield (DGS2, daily)."
      - name: yield_curve_spread
        description: >
          10Y minus 2Y Treasury yield spread. Negative values indicate
          yield curve inversion, historically a recession signal.
      - name: mortgage_rate_30y
        description: "30-Year Fixed Mortgage Rate (MORTGAGE30US, weekly)."
      - name: unemployment_rate
        description: "Unemployment Rate percent (UNRATE, monthly)."
      - name: nonfarm_payrolls
        description: >
          Total nonfarm payrolls in thousands of persons
          (PAYEMS, monthly).
      - name: cpi_all_urban
        description: >
          Consumer Price Index — All Urban Consumers, index value
          (CPIAUCSL, monthly).
      - name: core_cpi
        description: >
          Core CPI excluding food and energy, index value
          (CPILFESL, monthly).
      - name: pce_price_index
        description: >
          PCE Price Index, index value (PCEPI, monthly).
      - name: gdp_nominal
        description: "Nominal GDP in billions USD (GDP, quarterly)."
      - name: gdp_real
        description: >
          Real GDP chained 2017 dollars in billions
          (GDPC1, quarterly).
      - name: housing_starts
        description: >
          Housing starts in thousands of units
          (HOUST, monthly).
      - name: consumer_sentiment
        description: >
          University of Michigan Consumer Sentiment Index
          (UMCSENT, monthly).
      - name: industrial_production
        description: "Industrial Production Index (INDPRO, monthly)."
      - name: median_home_price_national
        description: >
          National median home sale price in USD
          (MSPUS, quarterly).
      - name: avg_hourly_earnings
        description: >
          Average hourly earnings for private employees in USD
          (AHETPI, monthly).
      - name: housing_affordability_ratio
        description: >
          Ratio of median home sale price to annual earnings
          (MSPUS / (AHETPI * 2080)). Higher values indicate lower
          affordability. NULL when either input is NULL.

  - name: stg_fred_economic__state_affordability
    description: >
      State-level affordability view. One row per (state_fips, date).
      Joins FHFA house price index series (annual) with BLS average
      weekly wage series (quarterly) on 2-digit state FIPS code and
      date. Rows with no observation on a given date for either series
      are excluded via the NOT NULL filter on value in each CTE.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [state_fips, date]
    columns:
      - name: state_fips
        description: >
          2-digit state FIPS code extracted from the series_id
          (e.g. '06' for California, '36' for New York).
        tests:
          - not_null
      - name: date
        description: "Observation date."
        tests:
          - not_null
      - name: house_price_index
        description: >
          FHFA all-transactions house price index for the state
          (ATNHPIUS<FIPS>A series, annual).
      - name: avg_weekly_wage
        description: >
          Average weekly wage in USD for the state
          (ENUC<FIPS>40010SA series, quarterly).
      - name: housing_affordability_ratio
        description: >
          house_price_index / avg_weekly_wage. An index-based ratio —
          not an absolute dollar measure. Higher means less affordable.
          NULL when either input is NULL.

  - name: stg_cmc__coin_daily
    description: "Denormalized view combining wh_cmc_returns, wh_cmc_coin_metadata, and wh_cmc_category_coins. One row per (date, coin_id)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, coin_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "price_usd > 0"
    columns:
      - name: date
        description: "Quote date."
        tests:
          - not_null
      - name: coin_id
        description: "CoinMarketCap coin identifier."
        tests:
          - not_null
      - name: symbol
        description: "Coin ticker symbol."
      - name: name
        description: "Full coin name."
      - name: price_usd
        description: "Closing price in USD."
        tests:
          - not_null
      - name: market_cap_usd
        description: "Market capitalisation in USD."
      - name: volume_24h_usd
        description: "24-hour trading volume in USD."
      - name: daily_return
        description: "Daily return. Null on first day of history."
      - name: return_30d
        description: "Point-in-time 30-day return."
      - name: rolling_return_30d
        description: "Trailing 30-day average daily return."
      - name: return_90d
        description: "Point-in-time 90-day return."
      - name: rolling_return_90d
        description: "Trailing 90-day average daily return."
      - name: return_365d
        description: "Point-in-time 365-day return."
      - name: rolling_return_365d
        description: "Trailing 365-day average daily return."
      - name: slug
        description: "URL slug for the coin on coinmarketcap.com."
      - name: coin_category
        description: "Primary category tag from CMC coin metadata."
      - name: tags
        description: "JSON-serialized array of tags."
      - name: website
        description: "Primary website URL."
      - name: category_id
        description: "CoinMarketCap category identifier. Null if coin has no category mapping."
      - name: category_name
        description: "Human-readable category name."

  - name: stg_cmc__category_daily
    description: "Category-level aggregation view. One row per (date, category_id). Aggregates constituent coin metrics."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, category_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_market_cap_usd >= 0 or total_market_cap_usd is null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "num_coins >= 1"
    columns:
      - name: date
        description: "Quote date."
        tests:
          - not_null
      - name: category_id
        description: "CoinMarketCap category identifier."
        tests:
          - not_null
      - name: category_name
        description: "Human-readable category name."
        tests:
          - not_null
      - name: total_market_cap_usd
        description: "Sum of market caps of constituent coins in USD."
      - name: total_volume_24h_usd
        description: "Sum of 24-hour volumes of constituent coins in USD."
      - name: num_coins
        description: "Number of distinct coins contributing to this category on this date."
      - name: avg_daily_return
        description: "Average daily return across constituent coins."
      - name: avg_return_30d
        description: "Average 30-day return across constituent coins."
      - name: avg_rolling_return_30d
        description: "Average rolling 30-day return across constituent coins."
      - name: avg_return_90d
        description: "Average 90-day return across constituent coins."
      - name: avg_rolling_return_90d
        description: "Average rolling 90-day return across constituent coins."
      - name: avg_return_365d
        description: "Average 365-day return across constituent coins."
      - name: avg_rolling_return_365d
        description: "Average rolling 365-day return across constituent coins."

  - name: stg_indices__rolling_stats
    description: "Rolling statistics view for equity indices. One row per (index_ticker, date). Provides MAs, volatility, and 52-week high."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [index_ticker, date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "vol_20d_annualized >= 0 or vol_20d_annualized is null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ma_20d > 0 or ma_20d is null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "close > 0"
    columns:
      - name: index_ticker
        description: "Lowercase ticker symbol."
        tests:
          - not_null
      - name: date
        description: "Trading date."
        tests:
          - not_null
      - name: close
        description: "Closing price."
        tests:
          - not_null
      - name: trading_day_seq
        description: "Sequential trading day ordinal."
      - name: daily_return
        description: "Daily return from wh_indices_returns."
      - name: ma_20d
        description: "20-day simple moving average. Null for the first 19 trading days."
      - name: ma_50d
        description: "50-day simple moving average. Null for the first 49 trading days."
      - name: vol_20d_annualized
        description: "20-day annualized realized volatility. Null for the first 19 trading days."
      - name: rolling_max_close_252d
        description: "Rolling 52-week high (trailing 252 trading days)."
