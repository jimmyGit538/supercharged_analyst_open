name: 'supercharged_analyst'
version: '1.0.0'
config-version: 2

profile: 'supercharged_analyst'

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  supercharged_analyst:
    1_staging_warehouses:
      +materialized: view
      +schema: stg_warehouses
    2_warehouses:
      +materialized: table
      +schema: warehouses
    3_staging_marts:
      +materialized: view
      +schema: stg_marts
    4_marts:
      +materialized: table
      +schema: marts

seeds:
  supercharged_analyst:
    +schema: warehouses
