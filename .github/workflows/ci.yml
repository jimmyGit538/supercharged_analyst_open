name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff sqlfluff

      - name: Lint Python
        run: ruff check 01_extraction/

      - name: Lint SQL (dbt)
        run: sqlfluff lint 02_dbt/models/ --dialect bigquery

      - name: Validate CLAUDE.md
        run: python3 scripts/validate_claude_md.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build extraction images
        run: |
          shopt -s nullglob
          for dir in 01_extraction/*/; do
            source=$(basename "$dir")
            docker build "$dir"
          done

      - name: Build dbt image
        run: docker build 02_dbt/
