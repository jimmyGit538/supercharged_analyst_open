name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff sqlfluff

      - name: Lint Python
        run: ruff check extraction/

      - name: Lint SQL (dbt)
        run: sqlfluff lint dbt/models/ --dialect bigquery

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker YOUR_REGION-docker.pkg.dev

      - name: Build and push extraction images
        run: |
          for dir in extraction/*/; do
            source=$(basename "$dir")
            docker build \
              -t YOUR_REGION-docker.pkg.dev/YOUR_GCP_PROJECT_ID/extraction/${source}:${{ github.sha }} \
              -t YOUR_REGION-docker.pkg.dev/YOUR_GCP_PROJECT_ID/extraction/${source}:latest \
              "$dir"
            docker push YOUR_REGION-docker.pkg.dev/YOUR_GCP_PROJECT_ID/extraction/${source}:${{ github.sha }}
          done
