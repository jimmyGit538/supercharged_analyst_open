name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff sqlfluff

      - name: Lint Python
        run: ruff check 01_extraction/

      - name: Lint SQL (dbt)
        run: sqlfluff lint 02_dbt/models/ --dialect bigquery

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push extraction images
        run: |
          shopt -s nullglob
          for dir in 01_extraction/*/; do
            source=$(basename "$dir")
            docker build \
              -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/extraction/${source}:${{ github.sha }} \
              -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/extraction/${source}:latest \
              "$dir"
            docker push ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/extraction/${source}:${{ github.sha }}
          done
